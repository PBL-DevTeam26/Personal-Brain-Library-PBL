name: M1 checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/api/test/domain.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r services/ml/requirements.txt
      - run: cd services/ml && python -m unittest -v test_features
